# 在 docker/ 目录下执行: docker compose up -d --build
# 构建上下文为仓库根目录 (..)

services:
  mongo:
    container_name: weaveeye-mongodb
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    container_name: weaveeye-backend
    build:
      context: ..
      dockerfile: diag_backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      FACTORIES_YAML_PATH: /etc/weaveeye/factories.yaml
      KNOWLEDGE_BASE_STORAGE_PATH: /data/knowledge_base
      LOG_FILE: ""
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ../diag_backend/configs/factories.yaml:/etc/weaveeye/factories.yaml:ro
      - knowledge_data:/data/knowledge_base
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    container_name: weaveeye-frontend
    build:
      context: ../diag_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_OA_LOGIN_URL: ${VITE_OA_LOGIN_URL:-http://tl.cooacloud.com/springboard_v3/login_proxy/diagweaveeye}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  knowledge_data:
